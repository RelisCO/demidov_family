{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="logout-success">
        <div class="card text-center" style="max-width: 500px; margin: 100px auto;">
            <div class="card-body">
                <div class="mb-4">
                    <i class="fas fa-check-circle fa-5x text-success mb-3"></i>
                    <h2>Вы успешно вышли из системы</h2>
                    <p class="text-muted">Спасибо за посещение сайта семьи Демидовых</p>
                </div>
                
                <div class="d-grid gap-3">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt"></i> Войти снова
                    </a>
                    <a href="{% url 'index' %}" class="btn btn-outline-secondary btn-lg">
                        <i class="fas fa-home"></i> На главную
                    </a>
                </div>
                
                <div class="mt-4">
                    <p class="text-muted">
                        <small>Вы можете закрыть эту страницу или войти под другим пользователем</small>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.logout-success {
    min-height: 70vh;
    display: flex;
    align-items: center;
}

.card {
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border: none;
}

.btn-lg {
    padding: 15px 30px;
    border-radius: 10px;
    font-size: 1.1em;
}
</style>
{% endblock %}
